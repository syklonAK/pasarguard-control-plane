services:
  gateway:
    ports: []
    expose: ["80"]
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    env_file: .env
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [gateway]
volumes:
  caddy_data: {}
  caddy_config: {}
