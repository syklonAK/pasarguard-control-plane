<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wholesale Control Panel</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="styles.css"></head><body>
<header><div><small>Business Panel</small><h1 id="org">Connecting…</h1></div><span id="status" class="pill">Online</span></header>
<main><section class="balance"><small>Available credit</small><strong id="available">—</strong><div><span>Balance <b id="balance">—</b></span><span>Credit <b id="credit">—</b></span></div></section>
<section class="stats"><article><small>Total usage</small><b id="usage">—</b></article><article><small>Resellers</small><b id="children-count">—</b></article></section>
<nav><button data-page="home" class="active">Home</button><button data-page="children">Resellers</button><button data-page="finance">Billing</button></nav>
<section id="home" class="page active"><h2>Quick actions</h2><div class="actions"><button id="fund">Request credit</button><button id="new-child">Add reseller</button><button id="refresh">Refresh</button></div><div id="notice" class="notice">Financial requests require administrator approval.</div></section>
<section id="children" class="page"><h2>Resellers</h2><div id="children-list" class="list"></div></section>
<section id="finance" class="page"><h2>Recent transactions</h2><div id="transactions" class="list"></div></section></main>
<div id="modal" class="modal"><form id="modal-form"><h3 id="modal-title"></h3><div id="modal-fields"></div><div class="modal-actions"><button type="button" id="cancel">Cancel</button><button type="submit">Submit</button></div></form></div><script src="app.js"></script></body></html>
