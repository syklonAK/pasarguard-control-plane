events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Docker container IPs can change whenever a service is recreated.
  # Resolve service names at request time instead of caching stale IPs.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  limit_req_zone $binary_remote_addr zone=control:10m rate=50r/s;

  server {
    listen 80;
    client_max_body_size 2m;

    location = /app {
      return 308 /app/$is_args$args;
    }

    location = /app/styles.css {
      root /usr/share/nginx/html;
      try_files $uri =404;
      add_header Cache-Control "no-store" always;
    }

    location = /app/app.js {
      root /usr/share/nginx/html;
      try_files $uri =404;
      add_header Cache-Control "no-store" always;
    }

    location /app/ {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /app/index.html;
      add_header Cache-Control "no-store" always;
    }

    location /telegram/ {
      set $telegram_backend http://telegram-gateway:8010;
      proxy_pass $telegram_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    location / {
      limit_req zone=control burst=100 nodelay;
      set $control_backend http://api:8000;
      proxy_pass $control_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
