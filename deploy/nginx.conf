events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  upstream control_api { least_conn; server api:8000; keepalive 128; }
  upstream telegram_gateway { least_conn; server telegram-gateway:8010; keepalive 64; }
  limit_req_zone $binary_remote_addr zone=control:10m rate=50r/s;

  server {
    listen 80;
    client_max_body_size 2m;

    location = /app {
      return 308 /app/$is_args$args;
    }

    location = /app/styles.css {
      root /usr/share/nginx/html;
      try_files $uri =404;
      add_header Cache-Control "no-store" always;
    }

    location = /app/app.js {
      root /usr/share/nginx/html;
      try_files $uri =404;
      add_header Cache-Control "no-store" always;
    }

    location /app/ {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /app/index.html;
      add_header Cache-Control "no-store" always;
    }

    location /telegram/ {
      proxy_pass http://telegram_gateway;
      proxy_http_version 1.1;
      proxy_set_header X-Request-ID $request_id;
    }

    location / {
      limit_req zone=control burst=100 nodelay;
      proxy_pass http://control_api;
      proxy_http_version 1.1;
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
