services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: control, POSTGRES_USER: control, POSTGRES_PASSWORD: control}
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U control -d control"], interval: 5s, timeout: 3s, retries: 20}
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}}
  worker:
    build: .
    env_file: .env
    command: ["python","-m","control_plane.worker"]
    depends_on: {postgres: {condition: service_healthy}}
volumes: {pg_data: {}}
