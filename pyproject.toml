[build-system]
requires=["setuptools>=75"]
build-backend="setuptools.build_meta"
[project]
name="pasarguard-control-plane"
version="0.3.0"
requires-python=">=3.12"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.32,<1","sqlalchemy>=2,<3","psycopg[binary]>=3.2,<4","pydantic-settings>=2.7,<3","httpx>=0.28,<1","redis>=5,<6","prometheus-client>=0.21,<1"]
[tool.setuptools.packages.find]
where=["src"]
